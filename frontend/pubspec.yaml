# carolina/frontend/pubspec.yaml
name: carolina
description: Sistema de Gestión - Distribuidora de Quesos Carolina
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  pdf: ^3.12.0
  printing: ^5.12.0
  provider: ^6.1.1
  file_picker: ^6.1.1
  flutter_lints: ^2.0.0
  flutter_localization: ^0.4.0
  intl: ^0.20.2
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_carolina.png